# Workflow simplificado para gerar um APK de teste (sem assinatura de loja),
# a partir do fork com o patch de personagens já aplicado.

name: Build Android APK (debug)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: 28.2.13676358
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358

    steps:
      - uses: actions/checkout@v4

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: accept licenses and install SDK packages + NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          echo "using sdkmanager at $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;$NDK_VERSION"

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile=false

      - name: setup vendors
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: write env file
        working-directory: apps/readest-app
        run: |
          echo "NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}" >> .env.local

      - name: init android project
        working-directory: apps/readest-app
        run: |
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          
          # Garante permissão de execução no gradlew
          chmod +x src-tauri/gen/android/gradlew

          # Injeta a regra para resolver a ambiguidade dos sabores de build (foss vs googleplay)
          GRADLE_FILE="src-tauri/gen/android/app/build.gradle.kts"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i '/defaultConfig {/a \        missingDimensionStrategy("store", "foss")' "$GRADLE_FILE"
          fi

      - name: patch next.config to skip type checking for this build
        working-directory: apps/readest-app
        run: |
          sed -i "s/const nextConfig = {/const nextConfig = {\n  typescript: { ignoreBuildErrors: true },/" next.config.mjs
          grep -n "ignoreBuildErrors" next.config.mjs

      - name: build debug APK (unsigned, for local testing only)
        working-directory: apps/readest-app
        run: pnpm tauri android build --debug -t aarch64

      - name: upload APK
        uses: actions/upload-artifact@v4
        with:
          name: readest-personagens-debug-apk
          path: apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 14