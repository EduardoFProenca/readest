# Workflow simplificado para gerar um APK de teste (sem assinatura de loja),
# a partir do fork com o patch de personagens já aplicado.
#
# Como usar:
# 1. Salve este arquivo como .github/workflows/android-build-simple.yml
#    dentro do seu fork/repositório do Readest.
# 2. Vá em Settings > Secrets and variables > Actions e crie os segredos:
#    NEXT_PUBLIC_POSTHOG_KEY, NEXT_PUBLIC_POSTHOG_HOST,
#    NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
#    (pode deixar vazios/"" se não usar essas integrações - só não pode faltar a chave)
# 3. Vá na aba "Actions" do seu repositório, escolha este workflow
#    e clique em "Run workflow".
# 4. Quando terminar (uns 40-60 min na primeira vez), baixe o APK
#    no final da página de execução, em "Artifacts".

name: Build Android APK (debug)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # A runner ubuntu-latest já vem com o Android SDK pré-instalado em
      # $ANDROID_HOME. Em vez de usar a action android-actions/setup-android
      # (que tenta instalar o pacote legado "tools", removido pelo Google e
      # que causa falha), chamamos o sdkmanager já presente na máquina
      # diretamente, só para aceitar as licenças e instalar o que falta.
      - name: accept licenses and install SDK packages + NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          echo "using sdkmanager at $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;$NDK_VERSION"

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile=false

      - name: setup vendors
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: write env file
        working-directory: apps/readest-app
        run: |
          echo "NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.local

      - name: init android project
        working-directory: apps/readest-app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          rm -rf src-tauri/gen/android
          pnpm tauri android init

      - name: build debug APK (unsigned, for local testing only)
        working-directory: apps/readest-app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: pnpm tauri android build --debug -t aarch64

      - name: upload APK
        uses: actions/upload-artifact@v4
        with:
          name: readest-personagens-debug-apk
          path: apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 14
